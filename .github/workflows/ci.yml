name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Web tests and build
        working-directory: web
        run: npm ci && npm test && npm run build
      - name: Go vet and tests
        run: go vet ./cmd/... ./internal/... ./web && go test -race ./cmd/... ./internal/...
      - name: Playwright smoke
        working-directory: web
        run: npx playwright install --with-deps chromium && npx playwright test smoke
      - name: Docker build
        run: docker build -t gantry .
