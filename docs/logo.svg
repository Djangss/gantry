<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gantry">
  <rect width="512" height="512" rx="112" fill="#3b434b"/>
  <g fill="none" stroke="#f5a623" stroke-linecap="square" stroke-linejoin="miter">
    <!-- truss girder spanning the legs -->
    <path d="M84 112h344M84 160h344" stroke-width="16"/>
    <path d="M100 160l40-48 40 48 40-48 40 48 40-48 40 48 40-48 40 48" stroke-width="8"/>
    <!-- legs, with knee braces into the girder -->
    <path d="M124 172v232M388 172v232" stroke-width="22"/>
    <path d="M124 228l52-68M388 228l-52-68" stroke-width="10"/>
    <!-- hoist cables -->
    <path d="M238 184l-22 68M274 184l22 68" stroke-width="5"/>
  </g>
  <!-- trolley on the girder -->
  <rect x="224" y="164" width="64" height="22" rx="3" fill="#f5a623"/>
  <!-- feet -->
  <rect x="96" y="398" width="56" height="18" rx="3" fill="#f5a623"/>
  <rect x="360" y="398" width="56" height="18" rx="3" fill="#f5a623"/>
  <!-- container on the spreader -->
  <rect x="196" y="250" width="120" height="10" fill="#f5a623"/>
  <rect x="190" y="262" width="132" height="80" rx="3" fill="#aeb8c0"/>
  <path d="M212 270v64M234 270v64M256 270v64M278 270v64M300 270v64" stroke="#8a959e" stroke-width="6"/>
</svg>
